name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - laravel: '11.*'
            php: '8.1'
          - laravel: '12.*'
            php: '8.1'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    env:
      LARAVEL_VERSION: ${{ matrix.laravel }}
      STABILITY: ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${LARAVEL_VERSION}" --no-interaction --no-update
          composer update --"${STABILITY}" --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest
